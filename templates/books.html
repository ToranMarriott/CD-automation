<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8">
        <title>Ace Reads</title>
        <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    </head>
    <body>
        <header>
            <h1>Ace Reads</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/team">About</a>
                <a href="/books">Books</a>
                <a href="/films">Films</a>
                <a href="/signup">Sign Up</a>
                <a href="/sessions/new">Log In</a>
            </nav>
        </header>
        <main>
            <h2>Book List</h2>
            <ul>
                {% for book in books %}
                    <li>{{book.title}} by {{book.author}} <br>
                        {{book.synopsis}} <br>
                        {{book.star_rating}}/5 Stars</li>
                {% endfor %}
            </ul>
            <a href="/books/add_book">Add More Books!</a>
        </main>
    </body>
</html>
