<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8">
        <title>Ace Reads</title>
        <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    </head>
    <body>
        <header>
            <h1>Ace Reads</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/team">About</a>
                <a href="/books">Books</a>
                <a href="/films">Films</a>
                <a href="/signup">Sign Up</a>
                <a href="/sessions/new">Log In</a>
            </nav>
        </header>
        <main>
            <h2>Film List</h2>
            <ul>
                {% for film in films %}
                    <li>{{film.title}}, {{film.release_year}} by {{film.director}}</li>
                {% endfor %}
            </ul>
        </main>
    </body>
</html>
